<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>CodeWorks Lisans Merkezi</title>
  <style>
    :root{color-scheme:dark;font-family:Inter,Segoe UI,system-ui,sans-serif;background:#070a14;color:#eef3ff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% 0,#152b5d 0,transparent 35%),#070a14;min-height:100vh}.wrap{max-width:1100px;margin:auto;padding:42px 22px}.brand{display:flex;gap:14px;align-items:center;margin-bottom:30px}.logo{width:48px;height:48px;border-radius:15px;display:grid;place-items:center;background:linear-gradient(135deg,#62e7ff,#8975ff);color:#07101e;font-weight:900;font-size:20px}.eyebrow{color:#62e7ff;letter-spacing:.18em;font-size:11px}.muted{color:#9aa8c7}.grid{display:grid;grid-template-columns:330px 1fr;gap:18px}.card{border:1px solid #263656;background:rgba(14,19,36,.88);border-radius:20px;padding:22px;box-shadow:0 20px 70px #0005}h1{font-size:27px;margin:4px 0}h2{font-size:17px;margin:0 0 16px}label{display:block;font-size:12px;color:#9aa8c7;margin:14px 0 7px}input,textarea,button{width:100%;border:1px solid #33466d;background:#0b1225;color:#eef3ff;border-radius:11px;padding:12px;font:inherit}textarea{resize:vertical;font-family:ui-monospace,monospace;font-size:12px}button{cursor:pointer;background:linear-gradient(135deg,#4fdfff,#8d7cff);border:0;color:#081121;font-weight:750;margin-top:16px}button.secondary{background:#151e35;color:#dbe5ff;border:1px solid #354a74;margin-top:8px}.toolbar{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:15px}.toolbar button{width:auto;margin:0;padding:9px 13px}.table{overflow:auto}table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:12px 9px;border-bottom:1px solid #25324d;white-space:nowrap}th{color:#7f91b5;font-size:11px;letter-spacing:.08em}.status{color:#7cf0b0}.revoked{color:#ff8d9b}.key{font-family:ui-monospace,monospace;color:#7de6ff}.copy{padding:5px 8px;width:auto;margin:0;background:#172541;color:#dce8ff;border:1px solid #37517e;font-size:12px}.msg{min-height:20px;margin-top:12px;color:#ffb5c0;font-size:13px}@media(max-width:800px){.grid{grid-template-columns:1fr}}
  </style>
</head>
<body><main class="wrap">
  <div class="brand"><div class="logo">CW</div><div><div class="eyebrow">CODEWORKS AGENT</div><h1>Lisans Merkezi</h1><div class="muted">Lisans üretin, süresini yönetin ve gerektiğinde iptal edin.</div></div></div>
  <div class="grid"><section class="card"><h2>Yönetici girişi</h2><label>Yönetici anahtarı</label><input id="adminKey" type="password" autocomplete="off" placeholder="ADMIN_KEY"><label>Süre (gün)</label><input id="days" type="number" min="1" value="30"><label>Adet</label><input id="count" type="number" min="1" max="1000" value="1"><label>Not</label><input id="note" placeholder="Müşteri veya paket notu"><button id="generate">Lisans üret</button><button class="secondary" id="refresh">Lisansları yenile</button><div class="msg" id="msg"></div><label>Toplu kopyalama alanı</label><textarea id="bulkOutput" rows="8" readonly placeholder="Üretilen lisanslar burada, her satırda tek anahtar olacak."></textarea><button class="secondary" id="copyAll">Tümünü kopyala</button></section>
  <section class="card"><div class="toolbar"><div><h2>Tanımlı lisanslar</h2><div class="muted">Yalnızca yetkili yönetici anahtarıyla görüntülenir.</div></div><button class="secondary" id="refresh2">Yenile</button></div><div class="table"><table><thead><tr><th>LİSANS</th><th>BİTİŞ</th><th>DURUM</th><th>NOT</th><th></th></tr></thead><tbody id="rows"><tr><td colspan="5" class="muted">Anahtarınızı girip yenileyin.</td></tr></tbody></table></div></section></div>
</main><script>
const $=id=>document.getElementById(id), key=()=>$("adminKey").value.trim(), msg=t=>$("msg").textContent=t;
async function api(url,opt={}){const r=await fetch(url,{...opt,headers:{"content-type":"application/json",Authorization:`Bearer ${key()}`,...(opt.headers||{})}});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||`HTTP ${r.status}`);return d}
async function load(){try{const data=await api("/admin/api/licenses");$("rows").innerHTML=data.length?data.map(x=>{const active=!!x.activated_at;const expiry=x.expires_at?new Date(x.expires_at).toLocaleDateString("tr-TR"):"İlk kullanım bekleniyor";return `<tr><td class="key">${x.license_key}<br><button class="copy" data-copy="${x.license_key}">Kopyala</button></td><td>${expiry}</td><td class="${x.revoked?"revoked":"status"}">${x.revoked?"İptal":(active?"Aktif":"Hazır")}</td><td>${x.note||"—"}</td><td><button class="copy settings" data-key="${x.license_key}" data-revoked="${x.revoked}">Ayarlar</button></td></tr>`}).join(""):"<tr><td colspan=\"5\" class=\"muted\">Henüz lisans yok.</td></tr>";msg("")}catch(e){msg(e.message)}}
$("generate").onclick=async()=>{try{const count=Math.min(1000,Math.max(1,Number($("count").value)||1));const x=await api("/admin/api/licenses/generate",{method:"POST",body:JSON.stringify({count,days:Number($("days").value),note:$("note").value})});const list=x.licenses||[x];$("bulkOutput").value=list.map(v=>v.license_key).join("\n");msg(`${list.length} lisans üretildi.`);await load()}catch(e){msg(e.message)}};$("copyAll").onclick=async()=>{const value=$("bulkOutput").value.trim();if(!value)return msg("Kopyalanacak lisans yok.");await navigator.clipboard.writeText(value);msg("Lisanslar panoya kopyalandı.")};$("refresh").onclick=$("refresh2").onclick=load;
$("rows").onclick=async e=>{const b=e.target.closest("button");if(!b)return;if(b.dataset.copy){await navigator.clipboard.writeText(b.dataset.copy);msg("Lisans panoya kopyalandı.")}if(b.classList.contains("revoke")){try{await api(`/admin/api/licenses/${encodeURIComponent(b.dataset.key)}/revoke`,{method:"POST"});await load()}catch(x){msg(x.message)}}if(b.classList.contains("settings")){const days=Number(prompt("Gün eklemek için pozitif, çıkarmak için negatif değer girin. Örnek: 30 veya -7", "0"));if(Number.isNaN(days)||days<-3650||days>3650)return;const reactivate=b.dataset.revoked==="true"&&confirm("Bu lisansın iptalini de kaldırmak ister misiniz?");try{await api(`/admin/api/licenses/${encodeURIComponent(b.dataset.key)}/update`,{method:"POST",body:JSON.stringify({days,reactivate})});msg("Lisans ayarları güncellendi.");await load()}catch(x){msg(x.message)}}};
</script></body></html>
