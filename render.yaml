services:
  - type: web
    name: codeworks-license
    runtime: node
    plan: free
    rootDir: license-server
    buildCommand: npm ci
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: codeworks-license-db
          property: connectionString
      - key: ADMIN_KEY
        generateValue: true
      - key: TOKEN_SECRET
        generateValue: true
databases:
  - name: codeworks-license-db
    plan: free
